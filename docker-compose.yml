# Local stack with PostgreSQL. Credentials here are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: second_read
      POSTGRES_USER: second_read
      POSTGRES_PASSWORD: local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_read -d second_read"]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-only-secret
      POSTGRES_DB: second_read
      POSTGRES_USER: second_read
      POSTGRES_PASSWORD: local-only
      POSTGRES_HOST: db
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - media:/app/media
volumes:
  pgdata:
  media:
