{% extends "review/base.html" %}
{% block title %}Sign in · second-read{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
  {% if form.errors %}<p class="error">Wrong username or password.</p>{% endif %}
</section>
{% endblock %}
