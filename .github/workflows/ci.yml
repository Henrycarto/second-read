name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: second_read
          POSTGRES_USER: second_read
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: ruff check .
      - name: Tests
        env:
          POSTGRES_DB: ${{ matrix.database == 'postgres' && 'second_read' || '' }}
          POSTGRES_USER: second_read
          POSTGRES_PASSWORD: ci-only
          POSTGRES_HOST: localhost
        run: |
          python manage.py makemigrations --check --dry-run
          pytest
